# Isolated #296 HQ test Worker only.
# Never deploys Production verthill-chat. Never binds verthill-chat-media.
# Never creates a new Neon. Uses the already-prepared isolated Preview DB.
name: Cloudflare Worker Preview 296

on:
  push:
    branches:
      - cursor/chat-photo-preview-first-send-1267
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verthill-chat-preview-296
  cancel-in-progress: false

jobs:
  deploy-preview-296:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse Production Worker deploy
        run: |
          set -eu
          test -f cloudflare/verthill-chat/wrangler.jsonc
          node scripts/preview296/assert-isolated-wrangler.mjs
          if grep -n 'wrangler deploy$' .github/workflows/cloudflare-worker-preview-296.yml | grep -v 'preview296'; then
            echo "bare wrangler deploy is forbidden in this workflow"
            exit 1
          fi

      - name: Require Cloudflare account id
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is required"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: cloudflare/verthill-chat/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloudflare/verthill-chat
        run: npm ci

      - name: Generate isolated Worker secrets
        id: secrets
        run: |
          set +x
          set -eu
          auth="$(openssl rand -hex 32)"
          media="$(openssl rand -hex 32)"
          internal="$(openssl rand -hex 32)"
          echo "::add-mask::$auth"
          echo "::add-mask::$media"
          echo "::add-mask::$internal"
          {
            echo "chat_auth<<EOF"
            echo "$auth"
            echo "EOF"
            echo "chat_media<<EOF"
            echo "$media"
            echo "EOF"
            echo "chat_internal<<EOF"
            echo "$internal"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load prepared isolated Preview DB
        id: db
        env:
          PREVIEW296_DATABASE_URL: ${{ secrets.PREVIEW296_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -eu
          mkdir -p /tmp/preview296-prepared
          db_url="${PREVIEW296_DATABASE_URL:-}"
          if [ -z "$db_url" ]; then
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow cloudflare-worker-preview-296.yml --limit 8 --json databaseId,status --jq '[.[] | select(.status=="completed")][0].databaseId')"
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --repo "${GITHUB_REPOSITORY}" --name preview296-runtime --dir /tmp/preview296-prepared || true
            fi
            if [ -f /tmp/preview296-prepared/preview296-runtime.env ]; then
              db_url="$(python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/preview296-prepared/preview296-runtime.env").read_text()
          line = next((l for l in text.splitlines() if l.startswith("DATABASE_URL=")), "")
          print(line.split("=", 1)[1] if "=" in line else "")
          PY
          )"
            fi
          fi
          if [ -z "$db_url" ]; then
            echo "prepared isolated DATABASE_URL missing"
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "host=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          host="$(PREVIEW296_DATABASE_URL="$db_url" node scripts/preview296/assert-isolated-url.mjs)"
          echo "::add-mask::$db_url"
          {
            echo "present=yes"
            echo "host=$host"
            echo "database_url<<EOF"
            echo "$db_url"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy isolated preview296 Worker
        working-directory: cloudflare/verthill-chat
        run: |
          set +x
          set -eu
          test -x ./node_modules/.bin/wrangler
          ./node_modules/.bin/wrangler deploy --env preview296 | tee /tmp/preview296-deploy.txt
          if grep -E 'Deployed verthill-chat[^[-]|name: verthill-chat$' /tmp/preview296-deploy.txt; then
            echo "refusing output that looks like Production Worker"
            exit 1
          fi
          grep -F 'verthill-chat-preview-296' /tmp/preview296-deploy.txt
          grep -F 'verthill-chat-media-preview-296' /tmp/preview296-deploy.txt

      - name: Verify isolated Worker health
        id: health
        run: |
          set -eu
          node scripts/preview296/check-isolated-health.mjs
          echo "ok=yes" >> "$GITHUB_OUTPUT"
          echo "### isolated worker health" >> "$GITHUB_STEP_SUMMARY"
          echo "- GET https://verthill-chat-preview-296.19970106s.workers.dev/health = 200" >> "$GITHUB_STEP_SUMMARY"
          echo "- capabilities: chat_media_upgrade, attachment_upgraded" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm Production Worker was not changed
        run: |
          set -eu
          node scripts/preview296/check-production-untouched.mjs

      - name: Put isolated secrets on preview Worker only
        working-directory: cloudflare/verthill-chat
        run: |
          set +x
          set -eu
          printf '%s' "${{ steps.secrets.outputs.chat_auth }}" | ./node_modules/.bin/wrangler secret put CHAT_AUTH_SECRET --env preview296
          printf '%s' "${{ steps.secrets.outputs.chat_media }}" | ./node_modules/.bin/wrangler secret put CHAT_MEDIA_SECRET --env preview296
          printf '%s' "${{ steps.secrets.outputs.chat_internal }}" | ./node_modules/.bin/wrangler secret put CHAT_INTERNAL_SECRET --env preview296
          echo "preview worker secrets set; CHAT_PUSH_DISPATCH_URL left unset"

      - name: Set gt8t branch-only Preview env
        if: steps.health.outputs.ok == 'yes' && steps.db.outputs.present == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_GT8T_ID }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          CHAT_AUTH_SECRET: ${{ steps.secrets.outputs.chat_auth }}
          CHAT_MEDIA_SECRET: ${{ steps.secrets.outputs.chat_media }}
          CHAT_INTERNAL_SECRET: ${{ steps.secrets.outputs.chat_internal }}
          NEXT_PUBLIC_CHAT_WS_URL: wss://verthill-chat-preview-296.19970106s.workers.dev
          CHAT_WORKER_URL: https://verthill-chat-preview-296.19970106s.workers.dev
          CHAT_PHOTO_STORAGE: r2
        run: |
          set +x
          set -eu
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN missing after healthy Worker. Isolation env not applied."
            exit 1
          fi
          node scripts/preview296/set-gt8t-preview-env.mjs

      - name: Write isolated runtime artifact
        if: always()
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          CHAT_AUTH_SECRET: ${{ steps.secrets.outputs.chat_auth }}
          CHAT_MEDIA_SECRET: ${{ steps.secrets.outputs.chat_media }}
          CHAT_INTERNAL_SECRET: ${{ steps.secrets.outputs.chat_internal }}
        run: |
          set +x
          set -eu
          umask 077
          {
            echo "NEXT_PUBLIC_CHAT_WS_URL=wss://verthill-chat-preview-296.19970106s.workers.dev"
            echo "CHAT_WORKER_URL=https://verthill-chat-preview-296.19970106s.workers.dev"
            echo "CHAT_PHOTO_STORAGE=r2"
            echo "PREVIEW296_ADMIN_USERNAME=preview296_admin"
            echo "PREVIEW296_CADDY_USERNAME=preview296_caddy"
            echo "PREVIEW296_NEON_HOST=${{ steps.db.outputs.host }}"
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL:-}"
            printf 'CHAT_AUTH_SECRET=%s\n' "${CHAT_AUTH_SECRET:-}"
            printf 'CHAT_MEDIA_SECRET=%s\n' "${CHAT_MEDIA_SECRET:-}"
            printf 'CHAT_INTERNAL_SECRET=%s\n' "${CHAT_INTERNAL_SECRET:-}"
          } > /tmp/preview296-runtime.env
          if [ -f /tmp/preview296-prepared/preview296-runtime.env ]; then
            python3 - <<'PY'
          from pathlib import Path
          src = Path("/tmp/preview296-prepared/preview296-runtime.env")
          dst = Path("/tmp/preview296-runtime.env")
          keep = dst.read_text()
          extra = []
          for line in src.read_text().splitlines():
              if line.startswith("PREVIEW296_ADMIN_PASSWORD=") or line.startswith("PREVIEW296_CADDY_PASSWORD="):
                  extra.append(line)
          if extra:
              dst.write_text(keep + ("\n".join(extra) + "\n"))
          PY
          fi
          if [ -f /tmp/preview296-deploy.txt ]; then
            cp /tmp/preview296-deploy.txt /tmp/preview296-deploy.log
          else
            echo "worker deploy did not run or failed before writing log" > /tmp/preview296-deploy.log
          fi

      - name: Upload isolated runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview296-runtime
          retention-days: 3
          path: |
            /tmp/preview296-runtime.env
            /tmp/preview296-deploy.log

      - name: Write public isolation summary
        if: always()
        run: |
          set -eu
          echo "### preview296 isolation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: verthill-chat-preview-296" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2: verthill-chat-media-preview-296" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prepared Neon host: ${{ steps.db.outputs.host }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production Worker/R2/DO/Postgres were not targeted." >> "$GITHUB_STEP_SUMMARY"
          echo "- CHAT_PUSH_DISPATCH_URL left unset." >> "$GITHUB_STEP_SUMMARY"
          echo "- Test usernames: preview296_admin / preview296_caddy" >> "$GITHUB_STEP_SUMMARY"
