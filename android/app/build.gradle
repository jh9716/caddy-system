apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def loadKakaoNativeAppKey() {
    def key = System.getenv("KAKAO_NATIVE_APP_KEY") ?: ""
    def prop = findProperty("KAKAO_NATIVE_APP_KEY")
    if (!key && prop) key = prop.toString()
    def files = [
        rootProject.file("kakao.properties"),
        rootProject.file("local.properties")
    ]
    files.each { propsFile ->
        if (!key && propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            key = (props.getProperty("KAKAO_NATIVE_APP_KEY") ?: "").trim()
        }
    }
    return key.trim()
}

def kakaoNativeAppKey = loadKakaoNativeAppKey()
def kakaoScheme = kakaoNativeAppKey ? "kakao${kakaoNativeAppKey}" : "kakao_unconfigured"
if (kakaoNativeAppKey) {
    logger.lifecycle("Kakao native app key: configured")
} else {
    logger.lifecycle("Kakao native app key: not configured")
}

def releaseSigningEnvNames = [
    "ANDROID_KEYSTORE_PATH",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEY_ALIAS",
    "ANDROID_KEY_PASSWORD",
]

def readReleaseSigningEnv = { String name ->
    def value = System.getenv(name)
    return value != null ? value.toString().trim() : ""
}

def missingReleaseSigningEnv = releaseSigningEnvNames.findAll { name ->
    readReleaseSigningEnv(name).isEmpty()
}
def releaseKeystorePath = readReleaseSigningEnv("ANDROID_KEYSTORE_PATH")
def releaseKeystoreFileFound = !releaseKeystorePath.isEmpty() && file(releaseKeystorePath).isFile()
def releaseSigningReady = missingReleaseSigningEnv.isEmpty() && releaseKeystoreFileFound
if (releaseSigningReady) {
    logger.lifecycle("Release signing: configured")
} else if (!missingReleaseSigningEnv.isEmpty()) {
    logger.lifecycle("Release signing: not configured (missing env: ${missingReleaseSigningEnv.join(', ')})")
} else {
    logger.lifecycle("Release signing: not configured (keystore file not found)")
}

android {
    namespace = "kr.verthill.caddy"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kr.verthill.caddy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            kakaoNativeAppKey: kakaoNativeAppKey,
            kakaoScheme: kakaoScheme
        ]
        resValue "string", "kakao_native_app_key", kakaoNativeAppKey
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword readReleaseSigningEnv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias readReleaseSigningEnv("ANDROID_KEY_ALIAS")
                keyPassword readReleaseSigningEnv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

def signedReleaseTaskNames = [
    "assembleRelease",
    "bundleRelease",
    "signRelease",
    "signReleaseBundle",
] as Set

tasks.configureEach { task ->
    if (signedReleaseTaskNames.contains(task.name)) {
        task.doFirst {
            if (!releaseSigningReady) {
                def reason = !missingReleaseSigningEnv.isEmpty()
                    ? "missing env: ${missingReleaseSigningEnv.join(', ')}"
                    : "ANDROID_KEYSTORE_PATH is set but the keystore file was not found"
                throw new GradleException(
                    "Refusing ${task.name}: release signing is required and debug keystore fallback is disabled (${reason})."
                )
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "androidx.datastore") {
            details.useVersion rootProject.ext.datastoreVersion
        }
    }
}

tasks.register("checkReleaseSigning") {
    group = "verification"
    description = "Reports whether env-based release signing is ready. Never prints secret values."
    doLast {
        if (releaseSigningReady) {
            logger.lifecycle("Release signing: ready")
        } else if (!missingReleaseSigningEnv.isEmpty()) {
            logger.lifecycle("Release signing: not ready (missing env: ${missingReleaseSigningEnv.join(', ')})")
        } else {
            logger.lifecycle("Release signing: not ready (keystore file not found)")
        }
        logger.lifecycle("Release debug-keystore fallback: disabled")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.kakao.sdk:v2-user:$kakaoSdkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.lifecycle("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
